[project]
name = "flatprint"
version = "0.1.0"
description = "COMP1818 coursework: learning an image generator's fingerprint from flat images"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow>=11",
 "numpy>=2",
 "tqdm>=4.66",
 "pillow-heif>=0.18",
 "huggingface_hub>=0.34",
]

[project.optional-dependencies]
local = ["torch>=2.6", "diffusers>=0.35", "transformers>=4.50", "accelerate>=1.5", "sentencepiece", "protobuf"]
baselines = ["torch>=2.6", "torchvision", "diffusers>=0.35", "lpips>=0.1.4"]
api = ["httpx>=0.28"]
analysis = [
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "scipy>=1.18.1",
]

[project.scripts]
flatprint = "flatprint.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
 "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/flatprint"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.marimo.runtime]
# full-resolution residual images are noise and barely compress; a row of four 1280² PNGs passes the 8 MB default
output_max_bytes = 40_000_000
